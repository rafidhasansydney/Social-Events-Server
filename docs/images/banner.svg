<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">Bandhan — community starts with us</title>
  <desc id="desc">The Bandhan API, powering authenticated community events and participation.</desc>
  <defs>
    <linearGradient id="forest" x2="1" y2="1"><stop stop-color="#183d2e"/><stop offset="1" stop-color="#10231b"/></linearGradient>
  </defs>
  <rect width="1280" height="300" rx="20" fill="url(#forest)"/>
  <circle cx="1130" cy="135" r="185" fill="none" stroke="#bed0a1" stroke-opacity=".13"/>
  <circle cx="1130" cy="135" r="135" fill="none" stroke="#bed0a1" stroke-opacity=".13"/>
  <circle cx="1130" cy="135" r="85" fill="none" stroke="#bed0a1" stroke-opacity=".13"/>
  <circle cx="1130" cy="135" r="48" fill="#d36c43"/>

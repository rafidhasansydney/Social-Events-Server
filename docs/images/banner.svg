  <text x="64" y="201" fill="#e1e8d2" font-family="Arial, sans-serif" font-size="21">A little time. A lasting bond.</text>
  <text x="64" y="252" fill="#a9bba0" font-family="Arial, sans-serif" font-size="13">Create a gathering. Find your people. Leave a little good behind.</text>
